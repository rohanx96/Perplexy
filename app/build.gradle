apply plugin: 'com.android.application'

android {
    compileSdk 35
    namespace "com.contextgenesis.perplexy"

    defaultConfig {
        applicationId "com.contextgenesis.perplexy"
        minSdk 21
        targetSdk 35
        versionCode 8
        versionName "1.5.pY.8"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    //implementation 'com.facebook.android:facebook-android-sdk:4.1.0'
    //above this version requires support library v23.2.0
    annotationProcessor 'com.bluelinelabs:logansquare-compiler:1.3.6'
    implementation 'com.android.support:appcompat-v7:25.3.1'
    implementation 'com.android.support:support-v4:25.3.1'
    implementation 'com.android.support:cardview-v7:25.3.1'
    // TODO Step 3f: replace with modern indicator library
    // implementation 'com.viewpagerindicator:library:2.4.1@aar'
    implementation 'com.android.support:gridlayout-v7:25.3.1'
    implementation 'com.jakewharton:butterknife:7.0.1'
    implementation 'com.android.support:design:25.3.1'
    implementation 'com.github.satyan:sugar:1.5'
    implementation 'com.orhanobut:dialogplus:1.11@aar'
    implementation 'com.kyleduo.switchbutton:library:1.3.4'
    implementation 'com.google.android.gms:play-services-ads:8.4.0'
    implementation 'com.bluelinelabs:logansquare:1.3.6'
    implementation 'com.google.android.gms:play-services-analytics:8.4.0'
    implementation project(':unity-ads')
    implementation 'com.mikhaellopez:circularprogressbar:1.1.1'
}

apply plugin: 'com.google.gms.google-services'
